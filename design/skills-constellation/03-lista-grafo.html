<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habilidades — Lista con grafo vivo</title>
<style>
  :root{
    --background:#0f172a; --surface:#1e293b; --primary:#8b5cf6; --secondary:#06b6d4;
    --accent:#f43f5e; --text:#f8fafc; --text-muted:#94a3b8;
    --hairline:rgba(255,255,255,.10);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--background);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}

  header{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;
    background:rgba(15,23,42,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--hairline)}
  .header-inner{width:100%;max-width:1280px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
  .wordmark{font-weight:700;font-size:16px;background:linear-gradient(90deg,#8b5cf6,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
  nav{display:flex;gap:28px;font-size:14px;font-weight:500;color:var(--text-muted)}
  nav span[data-current]{color:var(--text)}

  section{max-width:1280px;margin:0 auto;padding:56px 24px 64px}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin:0 0 10px}
  h2{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em}
  .lead{margin:12px 0 0;max-width:620px;font-size:16px;line-height:1.7;color:var(--text-muted)}

  .split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:44px;margin-top:34px;align-items:start}

  /* Lista */
  .group + .group{margin-top:22px}
  .group-head{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
  .group-head h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}
  .group-head .count{font-size:11px;color:rgba(148,163,184,.7)}
  .group-head .rule{flex:1;height:1px;background:var(--hairline)}

  .row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;
    background:none;border:0;border-radius:8px;padding:7px 10px;cursor:pointer;
    transition:background-color .14s ease}
  .row .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--surface);
    border:1.5px solid rgba(148,163,184,.5);transition:border-color .14s ease,background-color .14s ease}
  .row .label{font-size:14px;font-weight:500;color:var(--text-muted);transition:color .14s ease}
  .row .lv{display:inline-flex;gap:2px;flex:none;margin-left:auto}
  .row .lv i{display:block;width:7px;height:4px;border-radius:1px;background:rgba(255,255,255,.10)}
  .row .lv i.on{background:var(--secondary)}
  .row .num{width:9px;flex:none;font-size:11px;font-weight:500;color:rgba(148,163,184,.6);text-align:right}
  .row.no-project .label{color:rgba(148,163,184,.75)}
  .row.no-project .label::after{content:"◦";margin-left:6px;color:rgba(148,163,184,.5)}
  .row:hover{background:rgba(255,255,255,.05)}
  .row:hover .label,.row:focus-visible .label{color:var(--text)}
  .row:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
  .row.is-active{background:rgba(139,92,246,.12)}
  .row.is-active .label{color:var(--text);font-weight:600}
  .row.is-active .dot{background:var(--primary);border-color:var(--primary)}
  .row.is-muted{opacity:.35}

  /* Panel del grafo */
  .panel{position:sticky;top:96px;background:var(--surface);border:1px solid var(--hairline);
    border-radius:16px;padding:20px}
  .panel .cap{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin:0 0 12px}
  .canvas{position:relative;width:100%;aspect-ratio:1/1}
  .canvas svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .canvas line{stroke:var(--secondary);stroke-width:1.2;opacity:.35}
  .canvas circle.halo{fill:rgba(139,92,246,.16)}
  .canvas circle.core{fill:var(--primary)}
  .canvas circle.sat{fill:var(--surface);stroke:rgba(148,163,184,.6);stroke-width:1.5}
  .canvas text{font-family:var(--font);font-size:11px;font-weight:500;fill:var(--text-muted)}
  .canvas .empty-hint{font-size:12px;font-weight:500;fill:rgba(148,163,184,.75);font-style:italic}

  .panel h3{margin:16px 0 0;font-size:17px;font-weight:600}
  .panel .cat{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--secondary);margin:0}
  .panel .block{margin-top:14px}
  .panel .block-label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin:0 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;font-weight:500;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--hairline);border-radius:6px;padding:3px 8px}
  .chip.link{color:var(--secondary);border-color:rgba(6,182,212,.25);background:rgba(6,182,212,.06)}
  .empty{font-size:12px;color:var(--text-muted);font-style:italic;margin:0}
  .hint{margin:16px 0 0;font-size:13px;line-height:1.6;color:var(--text-muted)}

  @media (max-width:900px){
    .split{grid-template-columns:minmax(0,1fr);gap:0}
    .panel{position:static;margin-top:28px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <span class="wordmark">Daniel DLRT</span>
    <nav aria-label="Secciones">
      <span>Proyectos</span><span data-current>Sobre mí</span><span>Contacto</span><span>CV</span>
    </nav>
  </div>
</header>

<main>
<section aria-labelledby="skills-title">
  <p class="eyebrow">Sobre mí</p>
  <h2 id="skills-title">Habilidades</h2>
  <p class="lead">La lista es la que ya conocés. Al lado, el grafo responde la pregunta que
    una lista no contesta: con qué trabajó esta habilidad y en qué proyecto.</p>

  <div class="split">
    <div id="list" aria-label="Lista de habilidades"></div>

    <aside class="panel" id="panel">
      <p class="cap">Relaciones</p>
      <div class="canvas">
        <svg id="mini" viewBox="0 0 400 400" aria-hidden="true"></svg>
      </div>
      <div id="detail" role="status" aria-live="polite"></div>
    </aside>
  </div>
</section>
</main>

<script>
/* Datos reales — src/data/projects.js + grupos de LanguageContext.jsx (rama es). */
const GROUPS = [
  { label:'Desarrollo',         skills:['Python','FastAPI','React','TypeScript','Tailwind CSS','SQL','Postgres','SQLite','Supabase','Git','pytest','GitHub Actions'] },
  { label:'Datos & ML',         skills:['Pandas','NumPy','Scikit-learn','PyCaret','EDA','Feature engineering','Predictive modeling','Time series','Jupyter'] },
  { label:'IA aplicada',        skills:['Gemini API','LLM integration','Streamlit','Agent-assisted development'] },
  { label:'BI & visualización', skills:['Power BI','Matplotlib','Seaborn','Data storytelling'] },
  { label:'Diseño',             skills:['Adobe Creative Suite','UX/UI'] },
];

const PROJECTS = [
  { name:'Datara',               stack:['Python','FastAPI','React','TypeScript','SQLite','Gemini API'] },
  { name:'ANV·BAR Web',          stack:['React','TypeScript','Tailwind CSS','Supabase','Postgres','SQL'] },
  { name:'AI PDF Generator',     stack:['Python','Streamlit','Gemini API','pytest','LLM integration'] },
  { name:'Churn',                stack:['Python','Pandas','PyCaret','Scikit-learn','EDA','Feature engineering','Predictive modeling'] },
  { name:'Olist',                stack:['Python','Pandas','NumPy','Matplotlib','EDA','Jupyter'] },
  { name:'Global Superstore',    stack:['Power BI','Data storytelling'] },
  { name:'RRHH Dashboard',       stack:['Power BI','Data storytelling'] },
  { name:'Videojuegos 1985–2016',stack:['Python','Pandas','Seaborn','Matplotlib','Jupyter'] },
  { name:'Portafolio',           stack:['React','TypeScript','Tailwind CSS','Git','GitHub Actions','UX/UI'] },
];

/* Niveles declarados por Daniel (1–5). */
const LEVEL = {
  'Python':5,'FastAPI':3,'React':3,'TypeScript':3,'Tailwind CSS':2,'SQL':5,'Postgres':3,
  'SQLite':5,'Supabase':3,'Git':4,'pytest':2,'GitHub Actions':1,
  'Pandas':4,'NumPy':4,'Scikit-learn':3,'PyCaret':2,'EDA':1,'Feature engineering':1,
  'Predictive modeling':2,'Time series':1,'Jupyter':4,
  'Gemini API':4,'LLM integration':3,'Streamlit':3,'Agent-assisted development':3,
  'Power BI':5,'Matplotlib':4,'Seaborn':4,'Data storytelling':5,
  'Adobe Creative Suite':2,'UX/UI':4,
};

const CATEGORY_OF = {};
GROUPS.forEach((g) => g.skills.forEach((s) => { CATEGORY_OF[s] = g.label; }));

const projectsOf = Object.fromEntries(
  Object.keys(CATEGORY_OF).map((s) => [s, PROJECTS.filter((p) => p.stack.includes(s)).map((p) => p.name)]),
);
const neighborsOf = Object.fromEntries(Object.keys(CATEGORY_OF).map((s) => [s, new Set()]));
PROJECTS.forEach((p) => {
  const stack = p.stack.filter((s) => CATEGORY_OF[s]);
  for (let i = 0; i < stack.length; i += 1) {
    for (let j = i + 1; j < stack.length; j += 1) {
      neighborsOf[stack[i]].add(stack[j]);
      neighborsOf[stack[j]].add(stack[i]);
    }
  }
});

/* ------------------------------ Lista ------------------------------ */
const list = document.getElementById('list');
const rowEls = new Map();

GROUPS.forEach((group) => {
  const wrap = document.createElement('div');
  wrap.className = 'group';
  wrap.innerHTML = `<div class="group-head"><h3>${group.label}</h3>
    <span class="count">${group.skills.length}</span><span class="rule"></span></div>`;

  const sorted = [...group.skills].sort((a, b) => LEVEL[b] - LEVEL[a] || a.localeCompare(b, 'es'));

  sorted.forEach((skill) => {
    const level = LEVEL[skill];
    const bridge = projectsOf[skill].length;
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'row' + (bridge ? '' : ' no-project');
    row.innerHTML = `<span class="dot"></span><span class="label">${skill}</span>
      <span class="lv" aria-hidden="true">${[1, 2, 3, 4, 5]
        .map((i) => `<i class="${i <= level ? 'on' : ''}"></i>`).join('')}</span>
      <span class="num" aria-hidden="true">${level}</span>`;
    row.setAttribute('aria-label',
      `${skill}, ${group.label}, nivel ${level} de 5${bridge ? `, en ${bridge} proyecto${bridge > 1 ? 's' : ''}` : ', sin proyecto vinculado'}`);
    row.addEventListener('pointerenter', () => select(skill));
    row.addEventListener('focus', () => select(skill));
    row.addEventListener('click', () => select(skill));
    wrap.appendChild(row);
    rowEls.set(skill, row);
  });
  list.appendChild(wrap);
});

/* --------------------------- Mini grafo ---------------------------- */
const NS = 'http://www.w3.org/2000/svg';
const mini = document.getElementById('mini');
const detail = document.getElementById('detail');
let current = null;

const HINT = `<p class="hint">Elegí una habilidad de la lista. Las líneas que aparecen
  acá son proyectos compartidos, no parecidos: son las que usaste con esta en el mismo trabajo.</p>`;

function renderGraph(skill) {
  mini.replaceChildren();
  if (!skill) {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', '200'); t.setAttribute('y', '196');
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('class', 'empty-hint');
    t.textContent = 'Ninguna habilidad seleccionada';
    mini.appendChild(t);
    return;
  }

  const cx = 200;
  const cy = 200;
  const radius = 132;
  const neighbors = [...neighborsOf[skill]];

  neighbors.forEach((name, i) => {
    const angle = -Math.PI / 2 + (i * 2 * Math.PI) / Math.max(neighbors.length, 1);
    const x = cx + radius * Math.cos(angle);
    const y = cy + radius * Math.sin(angle);

    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', cx); line.setAttribute('y1', cy);
    line.setAttribute('x2', x); line.setAttribute('y2', y);
    mini.appendChild(line);

    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('r', 5);
    dot.setAttribute('class', 'sat');
    mini.appendChild(dot);

    const label = document.createElementNS(NS, 'text');
    const cos = Math.cos(angle);
    label.setAttribute('x', x + cos * 12 + (cos < -0.2 ? -2 : 0));
    label.setAttribute('y', y + 4);
    label.setAttribute('text-anchor', cos > 0.3 ? 'start' : cos < -0.3 ? 'end' : 'middle');
    label.textContent = name;
    mini.appendChild(label);
  });

  const halo = document.createElementNS(NS, 'circle');
  halo.setAttribute('cx', cx); halo.setAttribute('cy', cy); halo.setAttribute('r', 26);
  halo.setAttribute('class', 'halo');
  mini.appendChild(halo);

  const core = document.createElementNS(NS, 'circle');
  core.setAttribute('cx', cx); core.setAttribute('cy', cy); core.setAttribute('r', 8);
  core.setAttribute('class', 'core');
  mini.appendChild(core);

  const caption = document.createElementNS(NS, 'text');
  caption.setAttribute('x', cx); caption.setAttribute('y', cy + 48);
  caption.setAttribute('text-anchor', 'middle');
  caption.textContent = skill;
  mini.appendChild(caption);
}

function renderDetail(skill) {
  if (!skill) { detail.innerHTML = HINT; return; }
  const projects = projectsOf[skill];
  const linked = [...neighborsOf[skill]];
  detail.innerHTML = `
    <p class="cat">${CATEGORY_OF[skill]}</p>
    <h3>${skill}</h3>
    <div class="block">
      <p class="block-label">Usada en · ${projects.length}</p>
      ${projects.length
        ? `<div class="chips">${projects.map((p) => `<span class="chip">${p}</span>`).join('')}</div>`
        : '<p class="empty">Todavía sin proyecto que la respalde.</p>'}
    </div>
    <div class="block">
      <p class="block-label">Trabaja junto a · ${linked.length}</p>
      ${linked.length
        ? `<div class="chips">${linked.map((s) => `<span class="chip link">${s}</span>`).join('')}</div>`
        : '<p class="empty">Sin conexiones todavía.</p>'}
    </div>`;
}

function select(skill) {
  if (current === skill) return;
  current = skill;
  const active = new Set([skill, ...neighborsOf[skill]]);
  rowEls.forEach((el, id) => {
    el.classList.toggle('is-active', id === skill);
    el.classList.toggle('is-muted', !active.has(id));
  });
  renderGraph(skill);
  renderDetail(skill);
}

renderGraph(null);
detail.innerHTML = HINT;
</script>
</body>
</html>
